<!-- Applies the stored (or OS-preferred) motion setting before first paint,
     so a visitor who paused animations never sees a single frame of them.
     Mirrors src/lib/motionStore.js — keep the key and values in sync. -->
<script>
  (function () {
    var motion = "on";
    try {
      var stored = localStorage.getItem("sieder.motion");
      if (stored === "on" || stored === "off") motion = stored;
      else if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) motion = "off";
    } catch (e) {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) motion = "off";
    }
    document.documentElement.setAttribute("data-motion", motion);
  })();
</script>
